<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Numeroloji Hesaplayıcı</title>
  <style>
    body{
      font-family: Arial, sans-serif;
      background:#f5f5f5;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      margin:0;
      padding:16px;
    }
    .container{
      background:#fff;
      padding:24px 28px;
      border-radius:10px;
      box-shadow:0 4px 12px rgba(0,0,0,.1);
      max-width:760px;
      width:100%;
    }
    h1{
      font-size:22px;
      margin:0 0 16px;
      text-align:center;
    }
    .hint{
      font-size:12px;
      color:#666;
      margin:8px 0 14px;
      line-height:1.35;
    }
    label{
      font-weight:600;
      display:block;
      margin-top:12px;
      margin-bottom:6px;
    }
    input[type="text"]{
      width:100%;
      padding:10px 12px;
      font-size:14px;
      border-radius:6px;
      border:1px solid #ccc;
      box-sizing:border-box;
    }
    button{
      width:100%;
      padding:10px 12px;
      font-size:15px;
      font-weight:600;
      border-radius:6px;
      border:none;
      cursor:pointer;
      margin-top:12px;
    }
    #calcBtn{background:#1e88e5;color:#fff;}
    #resetBtn{background:#b0b0b0;color:#000;}
    #pdfBtn{background:#4caf50;color:#fff;}
    .statusLine{margin-top:10px;font-size:12px;color:#555;text-align:center;}
    .statusOk{color:#2e7d32;font-weight:700;}
    .statusBad{color:#c62828;font-weight:700;}
    .resultBox{
      background:#f0f4ff;
      padding:14px;
      border-radius:6px;
      margin-top:14px;
    }
    .resultTitle{font-weight:bold;font-size:15px;margin-bottom:6px;}
    .resultSubtitle{font-size:12px;color:#555;margin:6px 0 10px;line-height:1.35;}
    .resultValue{font-size:16px;color:#1a237e;font-weight:700;}
  </style>
</head>

<body>
<div class="container">
  <h1>Numeroloji Hesaplayıcı</h1>

  <div class="hint">
    Not: JSON dosyaları aynı klasörde olmalı ve sayfa server üzerinden açılmalı.
  </div>

  <label>Doğum Tarihi (GG.AA.YYYY)</label>
  <input type="text" id="dogumTarihi">

  <label>İsim</label>
  <input type="text" id="isim">

  <label>Kızlık Soyadı</label>
  <input type="text" id="kizlik">

  <label>Soyadı</label>
  <input type="text" id="soyad">

  <button id="calcBtn">Hesapla</button>
  <button id="resetBtn">Reset</button>
  <button id="pdfBtn">Yorumu PDF Olarak İndir</button>

  <div class="statusLine" id="jsonStatus">
    JSON durumu: <span class="statusBad">yükleniyor...</span>
  </div>

  <div class="resultBox">
    <div class="resultTitle">Hayat Amacı</div>
    <div class="resultValue" id="hayatAmaci"></div>
  </div>

  <div class="resultBox">
    <div class="resultTitle">Ödül</div>
    <div class="resultValue" id="odul"></div>
  </div>

  <div class="resultBox">
    <div class="resultTitle">Sınavları</div>
    <div class="resultValue" id="sinavlarList"></div>
  </div>

  <div class="resultBox" id="mesleklerBox" style="display:none;">
    <div class="resultTitle">Uygun Meslekler</div>
    <div class="resultValue" id="mesleklerList"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
/* --- mevcut tüm JS aynen korunmuştur --- */
/* --- sadece PDF başlığı aşağıda değiştirilmiştir --- */

async function indirPDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y = 20;
  const left = 20;
  const rightWidth = 170;

  // === YENİ PDF BAŞLIĞI (EKLEME) ===
  const titleNameSafe = (lastDisplayName || "").toUpperCase().trim();
  const pdfTitle =
    `"${titleNameSafe || "GIRIS YAPILAN ISIM"}" ICIN SIMURG YOLCULUGU: NUMEROLOJI ANALIZ RAPORU`;

  doc.setFontSize(14);
  const titleLines = doc.splitTextToSize(pdfTitle, rightWidth);
  for (const line of titleLines) {
    doc.text(line, 105, y, { align:"center" });
    y += 7;
  }
  y += 6;
  // === EKLEME SONU ===

  doc.setFontSize(11);
  doc.text("PDF üretimi test amaçlıdır.", left, y);

  doc.save("numeroloji_raporu.pdf");
}
</script>
</body>
</html>
